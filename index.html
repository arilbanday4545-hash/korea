<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Quiz Mastery Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- musik -->
     <audio id="bgMusic" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-memories.mp3" type="audio/mpeg">
    Browsermu tidak mendukung audio.
</audio>

<div id="musicBtn" class="music-control off" onclick="toggleMusic()">
    <span id="musicIcon">🔇</span>
</div>
    <!-- musikend -->
    <div class="bg-animate"><div class="blob"></div></div>

    <div id="p-landing" class="container active">
        <div class="char-wrapper">
            <img src="karakter.png" class="floating-char">
        </div>
        <h1 class="bounce-text">안녕하세요!</h1>
        <p id="typing-text" class="typing-container"></p>
        <button class="btn-main pulse-button" onclick="nextPage('p-landing', 'p-data')">MULAI UJIAN ➔</button>
    </div>

    <div id="p-data" class="container">
        <h2 style="color: var(--primary); font-weight: 800;">DATA PESERTA</h2>
        <div class="input-group">
            <label>Nama Lengkap</label>
            <input type="text" id="username" placeholder="Contoh: muhamad najril">
        </div>
        <div class="input-group">
            <label>Program Studi</label>
            <input type="text" id="prodi" placeholder="Contoh: trmg">
        </div>
        <button class="btn-main" onclick="startQuiz()" style="width: 100%;">KONFIRMASI DATA</button>
        <button class="btn-sub" onclick="showBoard()" style="margin-top: 15px;">Lihat Peringkat 🏆</button>
    </div>

    <div id="p-quiz" class="container">
        <div class="quiz-info">
            <span id="q-counter">Soal 1/30</span>
            <div id="progress-bar"><div id="progress-fill"></div></div>
        </div>
        <div class="q-header">
            <button onclick="speakText()" class="btn-audio">🔊</button>
            <div class="q-text" id="main-question"></div>
        </div>
        <div id="options"></div>
    </div>

    <div id="p-result" class="container">
        <h2 style="margin-bottom: 5px;">Hasil Ujian</h2>
        <div id="grade-display" class="grade-big"></div>
        <h3 id="final-score-text"></h3>
        <div class="leaderboard-wrapper">
            <table class="leaderboard-table">
                <thead><tr><th>Pos</th><th>Nama</th><th>Skor (Benar)</th></tr></thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
        <button class="btn-main" onclick="location.reload()">KEMBALI KE AWAL</button>
        <button class="btn-reset" onclick="clearBoard()">Reset Board 🔒</button>
    </div>
<footer class="main-footer">
        Created by <span>Muhamad Najril</span> &copy; 2025
    </footer>

    <script src="script.js"></script>
</body>
</html>

    <script src="script.js"></script>
</body>
</html>
